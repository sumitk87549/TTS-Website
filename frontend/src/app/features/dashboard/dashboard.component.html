<div class="dashboard-layout">
  <!-- Mobile Header -->
  <header class="mobile-header">
    <a routerLink="/studio" class="brand">🎙️ words2voice</a>
    <div class="mobile-actions">
      <button class="theme-btn" (click)="themeService.toggle()">{{ themeService.isDark ? '☀️' : '🌙' }}</button>
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="menuOpen">
    <div class="sidebar-top">
      <a routerLink="/studio" class="sidebar-brand">
        <span class="brand-icon">🎙️</span>
        <span class="brand-text">words2voice</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/studio" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
        Studio
      </a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
      </a>
      <a routerLink="/voice-lab" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Voice Lab
      </a>
      <a routerLink="/history" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        History
      </a>
      <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Settings
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="usage-card">
        <div class="usage-header">
          <span class="usage-label">Today's usage</span>
          <span class="usage-value">{{ usage.charactersUsed | number }} / {{ usage.charactersLimit | number }}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" [style.width.%]="usagePercent" [class.danger]="usagePercent > 90"></div>
        </div>
      </div>

      <button class="theme-toggle-sidebar" (click)="themeService.toggle()">
        {{ themeService.isDark ? '☀️' : '🌙' }}
        {{ themeService.isDark ? 'Day Mode' : 'Night Mode' }}
      </button>

      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
