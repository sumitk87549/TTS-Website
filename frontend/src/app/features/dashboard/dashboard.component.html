<div class="dashboard-layout">
  <!-- Mobile Header -->
  <header class="mobile-header">
    <a routerLink="/" class="brand">
      <img src="logo.png" alt="words2voice" class="brand-logo-img" />
      <span>words2voice</span>
    </a>
    <div class="mobile-actions">
      <button class="theme-btn" (click)="themeService.toggle()">{{ themeService.isDark ? '☀️' : '🌙' }}</button>
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="menuOpen">
    <div class="sidebar-top">
      <a routerLink="/" class="sidebar-brand">
        <img src="logo.png" alt="words2voice" class="sidebar-logo-img" />
        <span class="brand-text">words2voice</span>
        <span class="beta-badge">BETA</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/studio" routerLinkActive="active" (click)="closeMenu()" id="nav-studio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Studio
      </a>
      <a routerLink="/history" routerLinkActive="active" (click)="closeMenu()" id="nav-history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
        History
      </a>
      <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()" id="nav-settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile & Settings
      </a>
    </nav>

    <div class="sidebar-bottom">
      <!-- Avatar / Profile button -->
      <div class="avatar-section">
        <a routerLink="/settings" class="avatar-btn" [title]="'Profile Settings'">
          <div class="avatar-circle" [style.background]="avatarColor">
            <span class="avatar-emoji">{{ avatarEmoji }}</span>
          </div>
          <div class="avatar-info">
            <span class="avatar-name">{{ avatarName }}</span>
            <span class="avatar-hint">Click to edit</span>
          </div>
        </a>
      </div>

      <button class="theme-toggle-sidebar" (click)="themeService.toggle()">
        {{ themeService.isDark ? '☀️' : '🌙' }}
        {{ themeService.isDark ? 'Day Mode' : 'Night Mode' }}
      </button>

      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="sidebar-overlay" *ngIf="menuOpen" (click)="closeMenu()"></div>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
