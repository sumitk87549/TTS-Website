<div class="auth-page">
  <div class="auth-decor">
    <div class="decor-content">
      <img src="logo.png" alt="words2voice" class="decor-logo-img" />
      <h2>Welcome back</h2>
      <p style="color: rgb(192, 191, 191);">Your voices are waiting for you.</p>
      <div class="decor-badges">
        <span>🇮🇳 Made for India</span>
        <span>✨ Fully Free</span>
      </div>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <a routerLink="/" class="auth-logo">
        <img src="logo.png" alt="words2voice" class="auth-logo-img" />
        <span>words2voice</span>
      </a>
      <h2>Log in to your studio</h2>
      <p class="auth-subtitle">Enter your credentials to continue.</p>

      <div class="error-banner" *ngIf="error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" [(ngModel)]="email" name="email" required placeholder="name@example.com"
            autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" [(ngModel)]="password" name="password" required
            placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-submit" [disabled]="loading || !email || !password" id="btn-login-submit">
          {{ loading ? 'Logging in...' : 'Log In' }}
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <a routerLink="/signup" class="btn-register-alt" id="btn-goto-register">
        Create a free account
      </a>

      <div class="auth-footer">
        Don't have an account? <a routerLink="/signup">Register free</a>
      </div>
    </div>
  </div>
</div>
