<div class="auth-page">
  <div class="auth-decor">
    <div class="decor-content">
      <span class="decor-icon">🎙️</span>
      <h2>Start creating</h2>
      <p>Free Hindi text-to-speech, ready in seconds.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <a routerLink="/" class="auth-logo">
        <span>🎙️</span> words2voice
      </a>
      <h2>Create your account</h2>
      <p class="auth-subtitle">Start generating professional Hindi voices for free.</p>

      <div class="error-banner" *ngIf="error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="signup-name">Your Name</label>
          <input type="text" id="signup-name" [(ngModel)]="displayName" name="displayName" required placeholder="Aarav" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" [(ngModel)]="email" name="email" required placeholder="name@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" [(ngModel)]="password" name="password" required placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-submit" [disabled]="loading || !email || !password || !displayName">
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a routerLink="/login">Log in</a>
      </div>
    </div>
  </div>
</div>
