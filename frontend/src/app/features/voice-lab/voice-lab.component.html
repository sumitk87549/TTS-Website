<div class="page-container">

  <div class="page-header">
    <div>
      <h2>Voice Lab</h2>
      <p class="subtitle">Meet our cast of digital voices.</p>
    </div>
  </div>

  <div class="banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    Voice cloning is coming with premium models —
    <a routerLink="/about">see the roadmap</a>.
  </div>

  <div class="empty-state" *ngIf="voices.length === 0">
    <div class="empty-icon">🎤</div>
    <p>Voice engine is warming up. The cast will appear shortly.</p>
  </div>

  <div class="voice-grid" *ngIf="voices.length > 0">
    <div class="voice-card" *ngFor="let v of voices">
      <div class="card-header">
        <div class="avatar" [class.female]="v.gender === 'female'">
          {{ v.display_name.charAt(0) }}
        </div>
        <div class="info">
          <h3>{{ v.display_name }}</h3>
          <span class="gender-tag">{{ v.gender }}</span>
        </div>
      </div>
      <div class="card-body">
        <span class="style-badge">{{ v.style_tag }}</span>
      </div>
    </div>
  </div>

</div>
