<div class="voice-col">
  <div class="voice-picker compact-picker">
    <div class="voice-picker-header">
      <span class="voice-picker-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
        Voice
      </span>
      <span class="selected-voice-badge" *ngIf="selectedVoice">
        {{ selectedVoice.display_name }} · {{ selectedVoice.engine_voice_id }}
      </span>
    </div>

    <div class="tabs">
      <button id="tab-male" class="tab" [class.active]="selectedTab === 'Male'" (click)="selectedTab = 'Male'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="10" cy="8" r="5" />
          <path d="M15.54 3.54L20 0M20 0v5M20 0h-5" />
        </svg>
        Male
      </button>
      <button id="tab-female" class="tab" [class.active]="selectedTab === 'Female'" (click)="selectedTab = 'Female'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="5" />
          <line x1="12" y1="13" x2="12" y2="21" />
          <line x1="9" y1="18" x2="15" y2="18" />
        </svg>
        Female
      </button>
    </div>

    <div class="tab-content compact-tab-content">
      <div class="voice-grid">
        <div class="voice-card compact-voice-card"
          *ngFor="let v of (selectedTab === 'Male' ? maleVoices : femaleVoices)"
          [class.selected]="selectedVoice?.id === v.id" (click)="voiceSelected.emit(v)"
          [id]="'voice-' + v.engine_voice_id" role="button" [attr.aria-pressed]="selectedVoice?.id === v.id"
          [attr.aria-label]="'Select voice ' + v.display_name">

          <!-- Cartoon Avatar from DiceBear -->
          <div class="voice-avatar-img">
            <img [src]="getAvatarUrl(v)" [alt]="v.display_name" loading="lazy" />
            <div class="voice-check-overlay" *ngIf="selectedVoice?.id === v.id">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
          </div>

          <div class="voice-info-compact">
            <div class="voice-name">{{ v.display_name }}</div>
            <div class="voice-id">{{ v.engine_voice_id }}</div>
            <div class="voice-tag">{{ v.style_tag }}</div>
            <div class="voice-usecase" *ngIf="voiceUseCases[v.engine_voice_id]">
              {{ voiceUseCases[v.engine_voice_id] }}
            </div>
          </div>

          <!-- Play preview button -->
          <button class="voice-preview-btn" [class.loading]="previewLoadingId === v.engine_voice_id"
            [class.playing]="previewPlayingId === v.engine_voice_id"
            (click)="previewRequested.emit({ voice: v, event: $event })"
            [title]="previewPlayingId === v.engine_voice_id ? 'Stop preview' : 'Preview voice'"
            [id]="'preview-' + v.engine_voice_id" [attr.aria-label]="'Preview voice ' + v.display_name">
            <span *ngIf="previewLoadingId === v.engine_voice_id" class="preview-spinner"></span>
            <svg *ngIf="previewPlayingId === v.engine_voice_id && previewLoadingId !== v.engine_voice_id" width="12"
              height="12" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg *ngIf="previewPlayingId !== v.engine_voice_id && previewLoadingId !== v.engine_voice_id" width="12"
              height="12" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div><!-- /voice-col -->
