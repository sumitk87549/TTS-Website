spring:
  application:
    name: voisetu-backend
  profiles:
    active: local
  sql:
    init:
      mode: always

---
server:
  error:
    include-stacktrace: never

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

supertonic:
  engine:
    base-url: http://127.0.0.1:8000
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  storage:
    audio-dir: backend-data/audio
  usage:
    daily-limit: 5000
    max-request-chars: 1000
